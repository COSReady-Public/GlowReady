name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Publish only the app. cosready.ai/glowready proxies to this site
      # (Landing repo, next.config rewrites): /glowready → cosready.html and
      # /glowready/* → the files below. The browser stays on /glowready (no
      # trailing slash), so cosready.html carries absolute /glowready/ paths;
      # index.html keeps relative paths for visits to the Pages URL itself.
      - name: Build site
        run: |
          mkdir _site
          cp -R index.html css js assets LICENSE _site/
          sed -E 's#(href|src)="(css|js|assets)/#\1="/glowready/\2/#g' index.html > _site/cosready.html
          grep -q 'href="/glowready/css/app.css"' _site/cosready.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
